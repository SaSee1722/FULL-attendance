// ── Utility ──────────────────────────────────────────
function downloadCanvas(canvasId, filename) {
  const canvas = document.getElementById(canvasId);
  canvas.toBlob((blob) => {
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.download = filename;
    link.href = url;
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 100);
  }, 'image/png');
}

function drawRoundedRect(ctx, x, y, w, h, r, fill) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
}

logo.onload = () => {
  drawIcon();

// ── APP ICON 512×512 ──────────────────────────────────
function drawIcon() {
  const canvas = document.getElementById('iconCanvas');
  const ctx = canvas.getContext('2d');
  const W = 512, H = 512;

  // Background (White as requested)
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);

  // Draw Logo (Centered and scaled - with nudge)
  const padding = 40;
  const size = W - (padding * 2);
  const nudgeX = 12; // Shift right to center the off-center logo
  ctx.drawImage(logo, padding + nudgeX, padding, size, size);
}

// ── FEATURE GRAPHIC 1024×500 ─────────────────────────
function drawFeature() {
  const canvas = document.getElementById('featureCanvas');
  const ctx = canvas.getContext('2d');
  const W = 1024, H = 500;

  // Background gradient
  const grad = ctx.createLinearGradient(0, 0, W, H);
  grad.addColorStop(0, '#020617');
  grad.addColorStop(0.5, '#0F172A');
  grad.addColorStop(1, '#1E293B');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Subtle grid
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 100) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y = 0; y < H; y += 100) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  // Draw Logo on the left (with nudge)
  const logoSize = 300;
  const nudgeX = 12;
  ctx.drawImage(logo, 60 + nudgeX, (H - logoSize) / 2 - 20, logoSize, logoSize);

  // App Name
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 80px Arial Black, Arial';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText('AttendX', 400, 180);

  // Tagline
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.font = '24px Arial';
  ctx.fillText('Smart Attendance Management', 402, 240);

  // Highlight footer
  ctx.fillStyle = '#3B82F6';
  ctx.fillRect(402, 270, 40, 3);
  
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.font = 'bold 14px Arial';
  ctx.fillText('DEVELOPED BY ZENLABS', 402, 300);
}
