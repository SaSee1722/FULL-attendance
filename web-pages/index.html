<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AttendX – Smart Attendance Management</title>
  <meta name="description" content="AttendX by zenlabs – Smart attendance management app for educational institutions." />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-align: center;
      padding: 24px;
    }
    .logo { font-size: 3rem; font-weight: 800; letter-spacing: -1px; }
    .logo span { color: #e94560; }
    .tagline { opacity: 0.7; margin-top: 10px; font-size: 1.1rem; }
    .links { margin-top: 40px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
    .link-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 10px;
      font-size: 0.97rem;
      transition: background 0.2s;
    }
    .link-btn:hover { background: rgba(255,255,255,0.2); }
    footer { position: fixed; bottom: 20px; font-size: 0.8rem; opacity: 0.45; }
  </style>
</head>
<body>
  <div class="logo">Attend<span>X</span></div>
  <p class="tagline">Smart Attendance Management by zenlabs</p>
  <div class="links">
    <a class="link-btn" href="./privacy-policy.html" id="privacy-policy-link">📄 Privacy Policy</a>
    <a class="link-btn" href="./delete-account.html" id="delete-account-link">🗑️ Delete Account / Data</a>
  </div>
  <footer>&copy; 2026 zenlabs</footer>
</body>
</html>
